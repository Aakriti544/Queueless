<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password — QueueLess</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page-bg:#EDEBE4;--frame-bg:#DCEAE8;--navy:#16233F;--navy-2:#1E3159;--line:#B9C7C4;--muted:#5C6B68}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:var(--page-bg);display:flex;align-items:center;justify-content:center;color:var(--navy);font-family:Inter,sans-serif}.card{width:500px;max-width:100%;padding:42px 50px;background:var(--frame-bg);border-radius:28px;box-shadow:0 30px 60px #16233f2e}.brand{text-align:center;font-weight:700;font-size:20px;margin-bottom:30px}.brand span{display:inline-grid;place-items:center;width:42px;height:42px;margin-right:9px;border-radius:12px;background:var(--navy);color:white}h1{font:700 30px 'Playfair Display',serif;text-align:center;margin:0 0 12px}p{font-size:14px;line-height:1.6;text-align:center;color:var(--muted);margin:0 0 26px}.field{margin:20px 0 16px}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;font:15px Inter,sans-serif;color:var(--navy);outline:none}input:focus{border-color:var(--navy)}button{width:100%;padding:14px;border:0;border-radius:13px;background:var(--navy);color:white;font:600 15px Inter,sans-serif;cursor:pointer}button:hover{background:var(--navy-2)}.message{display:none;margin-top:14px;padding:11px;border-radius:10px;font-size:13px;line-height:1.5}.message.show{display:block;background:#fae8e8;color:#963b3b}.back{display:block;text-align:center;margin-top:20px;color:var(--navy);font-size:13px;font-weight:600;text-decoration:none}@media(max-width:520px){.card{padding:34px 25px}h1{font-size:27px}}
</style></head><body><main class="card"><div class="brand"><span>Q</span>QueueLess</div><h1>Forgot Password?</h1><p>Enter your registered email address to receive an OTP.</p>
<form id="form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></div><button id="submit" type="submit">Send OTP</button><div id="message" class="message" role="alert"></div></form><a class="back" href="/login.html/">Back to Login</a></main>
<script>
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),m=document.getElementById('message');b.disabled=true;b.textContent='Sending…';m.className='message';try{const r=await fetch('/api/user/password-reset/request/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.message||'Unable to send a code.');location.assign(d.next||'/verify_otp.html/')}catch(err){m.textContent=err.message||'Unable to connect. Please try again.';m.className='message show'}finally{b.disabled=false;b.textContent='Send OTP'}});
</script></body></html>
