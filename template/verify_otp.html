<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Email — QueueLess</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--page-bg:#EDEBE4;--frame-bg:#DCEAE8;--navy:#16233F;--navy-2:#1E3159;--line:#B9C7C4;--muted:#5C6B68}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:var(--page-bg);display:flex;align-items:center;justify-content:center;color:var(--navy);font-family:Inter,sans-serif}.card{width:500px;max-width:100%;padding:42px 50px;background:var(--frame-bg);border-radius:28px;box-shadow:0 30px 60px #16233f2e}.brand{text-align:center;font-weight:700;font-size:20px;margin-bottom:30px}.brand span{display:inline-grid;place-items:center;width:42px;height:42px;margin-right:9px;border-radius:12px;background:var(--navy);color:white}h1{font:700 30px 'Playfair Display',serif;text-align:center;margin:0 0 12px}p{font-size:14px;line-height:1.6;text-align:center;color:var(--muted);margin:0 0 26px}.field{margin:20px 0 16px}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;font:15px Inter,sans-serif;color:var(--navy);outline:none;text-align:center;letter-spacing:8px}input:focus{border-color:var(--navy)}button{width:100%;padding:14px;border:0;border-radius:13px;background:var(--navy);color:white;font:600 15px Inter,sans-serif;cursor:pointer}button:hover{background:var(--navy-2)}button:disabled{opacity:.55;cursor:wait}.message{display:none;margin-top:14px;padding:11px;border-radius:10px;font-size:13px;line-height:1.5}.message.show{display:block;background:#fae8e8;color:#963b3b}.resend{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}.resend button{width:auto;padding:0;background:none;color:var(--navy);font:600 13px Inter,sans-serif}.resend button:disabled{color:var(--muted);cursor:wait}.back{display:block;text-align:center;margin-top:20px;color:var(--navy);font-size:13px;font-weight:600;text-decoration:none}@media(max-width:520px){.card{padding:34px 25px}h1{font-size:27px}}</style></head><body><main class="card"><div class="brand"><span>Q</span>QueueLess</div><h1>Verify your email</h1><p>Enter the 6-digit code sent to <strong>{{ masked_email }}</strong>. It expires in 5 minutes.</p><form id="form"><div class="field"><label for="otp">Verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required aria-label="6-digit verification code"></div><button id="verify" type="submit">Verify OTP</button><div id="message" class="message" role="alert"></div></form><div class="resend">Didn't receive it? <button id="resend" type="button" disabled>Resend OTP (60s)</button></div><a class="back" href="/forgot_password.html/">Start over</a></main>
<script>
const msg=document.getElementById('message');document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('verify');b.disabled=true;b.textContent='Verifying…';msg.className='message';try{const r=await fetch('/api/user/password-reset/verify/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({otp:document.getElementById('otp').value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.message||'Incorrect or expired code.');location.assign(d.next||'/reset_password.html/')}catch(err){msg.textContent=err.message||'Unable to verify the code.';msg.className='message show'}finally{b.disabled=false;b.textContent='Verify OTP'}});
const resend=document.getElementById('resend');let remain=60;const timer=setInterval(()=>{remain--;if(remain<=0){clearInterval(timer);resend.disabled=false;resend.textContent='Resend OTP'}else resend.textContent=`Resend OTP (${remain}s)`},1000);resend.addEventListener('click',async()=>{resend.disabled=true;resend.textContent='Sending…';try{const r=await fetch('/api/user/password-reset/resend/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok)throw Error(d.message||'Unable to resend.');msg.textContent=d.message;msg.className='message show';remain=60;const clock=setInterval(()=>{remain--;if(remain<=0){clearInterval(clock);resend.disabled=false;resend.textContent='Resend OTP'}else resend.textContent=`Resend OTP (${remain}s)`},1000)}catch(err){msg.textContent=err.message;msg.className='message show';resend.disabled=false;resend.textContent='Resend OTP'}});
</script></body></html>
