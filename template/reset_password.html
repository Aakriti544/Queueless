<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — QueueLess</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--page-bg:#EDEBE4;--frame-bg:#DCEAE8;--navy:#16233F;--navy-2:#1E3159;--line:#B9C7C4;--muted:#5C6B68}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:var(--page-bg);display:flex;align-items:center;justify-content:center;color:var(--navy);font-family:Inter,sans-serif}.card{width:500px;max-width:100%;padding:42px 50px;background:var(--frame-bg);border-radius:28px;box-shadow:0 30px 60px #16233f2e}.brand{text-align:center;font-weight:700;font-size:20px;margin-bottom:30px}.brand span{display:inline-grid;place-items:center;width:42px;height:42px;margin-right:9px;border-radius:12px;background:var(--navy);color:white}h1{font:700 30px 'Playfair Display',serif;text-align:center;margin:0 0 12px}p{font-size:14px;line-height:1.6;text-align:center;color:var(--muted);margin:0 0 26px}.field{margin:18px 0}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.input-wrap{position:relative}input{width:100%;padding:14px 52px 14px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;font:15px Inter,sans-serif;color:var(--navy);outline:none}input:focus{border-color:var(--navy)}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:auto;padding:7px 9px;background:transparent;color:var(--navy);font-size:12px}.eye:hover{background:#e9eeed}button.submit{width:100%;padding:14px;border:0;border-radius:13px;background:var(--navy);color:white;font:600 15px Inter,sans-serif;cursor:pointer;margin-top:8px}button.submit:hover{background:var(--navy-2)}.message{display:none;margin-top:14px;padding:11px;border-radius:10px;font-size:13px;line-height:1.5}.message.show{display:block;background:#fae8e8;color:#963b3b}.back{display:block;text-align:center;margin-top:20px;color:var(--navy);font-size:13px;font-weight:600;text-decoration:none}@media(max-width:520px){.card{padding:34px 25px}h1{font-size:27px}}</style></head><body><main class="card"><div class="brand"><span>Q</span>QueueLess</div><h1>Set a new password</h1><p>Choose a secure password with at least 8 characters.</p><form id="form"><div class="field"><label for="password">New Password</label><div class="input-wrap"><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button class="eye" type="button" data-for="password" aria-label="Show new password">Show</button></div></div><div class="field"><label for="confirm">Confirm New Password</label><div class="input-wrap"><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button class="eye" type="button" data-for="confirm" aria-label="Show confirmation password">Show</button></div></div><button id="submit" class="submit" type="submit">Update Password</button><div id="message" class="message" role="alert"></div></form><a class="back" href="/login.html/">Back to Login</a></main>
<script>
document.querySelectorAll('.eye').forEach(b=>b.addEventListener('click',()=>{const input=document.getElementById(b.dataset.for),show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'Hide':'Show';b.setAttribute('aria-label',`${show?'Hide':'Show'} ${b.dataset.for==='password'?'new password':'confirmation password'}`)}));document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value,b=document.getElementById('submit'),m=document.getElementById('message');m.className='message';if(p!==c){m.textContent='Passwords do not match.';m.className='message show';return}if(p.length<8){m.textContent='Password must be at least 8 characters.';m.className='message show';return}b.disabled=true;b.textContent='Updating…';try{const r=await fetch('/api/user/password-reset/complete/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p,confirm_password:c})}),d=await r.json();if(!r.ok)throw Error(d.message||'Unable to update password.');m.textContent=d.message||'Your password has been reset successfully!';m.style.background='#E1F5EE';m.style.color='#0F6E56';m.className='message show';setTimeout(()=>location.replace(d.redirect||'/login.html/'),1000)}catch(err){m.textContent=err.message||'Unable to update password.';m.className='message show'}finally{b.disabled=false;b.textContent='Update Password'}});
</script></body></html>
